name: Verify application
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: chickentinder_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chickentinder_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgrespassword@127.0.0.1:5432/chickentinder_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci && npm --prefix frontend ci
      - run: npm run build
      - run: npm run test:deployment
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: node scripts/run-tests.mjs --browser
      - run: npm audit --audit-level=moderate && npm --prefix frontend audit --audit-level=moderate
